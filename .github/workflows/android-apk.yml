name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Check TypeScript
        run: npm run check

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Allow release build with debug signing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          if "signingConfig signingConfigs.debug" not in text:
              text = text.replace(
                  "release {\n",
                  "release {\n            signingConfig signingConfigs.debug\n",
                  1,
              )

          path.write_text(text)
          PY

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: elocare-caa-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
